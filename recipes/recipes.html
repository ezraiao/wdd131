<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecipeBook</title>
    <meta name="description" content="Find simple and tasty recipes like apple crisp on RecipeBook." />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="RecipeBook">
    <meta property="og:description" content="Find simple and tasty recipes like apple crisp on RecipeBook.">
    <meta property="og:url" content="https://ezraiao.github.io/wdd131/recipes">
    <meta property="og:image" content="https://ezraiao.github.io/wdd131/recipes/images/apple-crisp.jpg">

    <!-- X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="RecipeBook">
    <meta name="twitter:description" content="Find simple and tasty recipes like apple crisp on RecipeBook.">
    <meta name="twitter:image" content="https://ezraiao.github.io/wdd131/recipes/images/apple-crisp.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/recipe-book.png">

    <!-- Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/recipe-book.png">

    <!-- Google Font: Amatic SC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="recipes.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="images/recipe-book.png" alt="recipe book logo">
        <h1>RecipeBook</h1>
      </div>
    </header>

    <main>
      <form class="search" action="#">
        <input type="search" name="search" placeholder="Find a recipe" aria-label="Find a recipe">
        <button type="submit">
          <img src="images/search.svg" alt="search">
        </button>
      </form>

      <hr>

      <section class="recipe">
        <div class="recipe-image">
          <img src="images/apple-crisp.jpg" alt="bowl of apple crisp with vanilla ice cream">
        </div>
        <div class="recipe-content">
          <p class="tag">dessert</p>
          <h2>Apple Crisp</h2>
          <span
            class="rating"
            role="img"
            aria-label="Rating: 4 out of 5 stars"
          >
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star-empty">☆</span>
          </span>
          <p class="description">This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
        </div>
      </section>
    </main>

    <footer>
      <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->
        <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
        <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
        <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
      </div>
      <p class="attribution">
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
      </p>
    </footer>
  </body>
</html>
