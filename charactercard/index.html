<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card | Snortleblat</title>
    <meta name="description" content="A JavaScript object character card for Snortleblat the Swamp Beast Diplomat. Attack him or level him up.">
    <meta name="author" content="Ezra Iao">

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Card | Snortleblat">
    <meta property="og:description" content="A JavaScript object character card for Snortleblat the Swamp Beast Diplomat.">
    <meta property="og:url" content="https://ezraiao.github.io/wdd131/charactercard/">
    <meta property="og:image" content="https://ezraiao.github.io/wdd131/charactercard/images/monster.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Character Card | Snortleblat">
    <meta name="twitter:description" content="A JavaScript object character card for Snortleblat the Swamp Beast Diplomat.">
    <meta name="twitter:image" content="https://ezraiao.github.io/wdd131/charactercard/images/monster.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="images/monster.png" type="image/png">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/monster.png">

    <link rel="stylesheet" href="styles (1).css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1 class="visually-hidden">Character Card</h1>
        <section class="card">
            <img class="image" id="charImage" src="" alt="" width="400" height="400">
            <h2 class="name" id="charName"></h2>
            <div class="stats">
                <p><strong>Class:</strong> <span id="charClass"></span></p>
                <p><strong>Level:</strong> <span id="charLevel"></span></p>
                <p><strong>Health:</strong> <span id="charHealth"></span></p>
                <p id="message" aria-live="polite"></p>
            </div>
            <div class="buttons">
                <button id="attackBtn" type="button">Attacked</button>
                <button id="levelBtn" type="button">Level Up</button>
            </div>
        </section>
    </main>
</body>
</html>
